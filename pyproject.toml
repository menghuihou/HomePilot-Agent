[project]
name = "homepilot-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "fastmcp==4.1.4",
    "langchain-anthropic>=1.7.6",
    "langfuse>=5.0.4",
    "langgraph==1.2.16",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
# 让测试进程能从项目根目录导入 app 包。
pythonpath = ["."]
